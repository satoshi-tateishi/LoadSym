<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoadSym Dropbox連携</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="min-h-screen bg-gray-100 text-gray-900 flex items-center justify-center">

<p id="message" class="text-sm text-gray-600">Dropboxと連携しています…</p>

<script type="module">
  import { handleCallback } from './assets/js/dropbox-client.js';

  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const authError = params.get('error_description') || params.get('error');
  const message = document.getElementById('message');

  if (authError) {
    message.textContent = `Dropbox連携に失敗しました: ${authError}`;
  } else if (!code) {
    message.textContent = '連携コードが見つかりませんでした。管理画面からやり直してください。';
  } else {
    try {
      await handleCallback(code);
      window.location.href = './admin.html?tab=backup';
    } catch (error) {
      console.error(error);
      message.textContent = error.message || 'Dropbox連携に失敗しました。';
    }
  }
</script>
</body>
</html>
