  <div x-show="equipmentForm" class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50"
       @click.self="equipmentForm = null">
    <form x-show="equipmentForm" class="bg-white rounded-lg shadow-lg w-full max-w-4xl p-5 space-y-3 max-h-[95vh] overflow-y-auto"
          @submit.prevent="saveEquipment()">
      <template x-if="equipmentForm">
        <!-- x-if で null を除外した時点のフォームを別名にし、内側の形状エディタを含む全項目で同じオブジェクトを参照する。 -->
        <div x-data="{ form: equipmentForm }" class="space-y-3">
          <h3 class="font-bold" x-text="form.id ? `${equipmentFormLabel}を編集` : `${equipmentFormLabel}を追加`"></h3>
          <!-- 入力欄とパレットを左右に並べ、縦を詰める。13インチのノートでもスクロールせずに
               全体を見せるため。形状エディタだけはこの外に置き、キャンバスの幅を削らない。 -->
          <div class="grid gap-3 md:grid-cols-[minmax(0,1fr)_auto] md:items-start">
          <div class="space-y-3 min-w-0">
          <div>
            <label class="block text-xs mb-1">名称</label>
            <input x-model="form.name" required class="w-full border rounded px-2 py-1 text-sm">
          </div>
          <div>
            <label class="block text-xs mb-1">カテゴリ</label>
            <!-- x-model は option が x-for で描かれる前に初期化されるため、値だけでは選択が復元されない。
                 :selected を option 側に持たせて、描画時に保存済みのカテゴリを選ばせる。
                 識別カラーの差し替えには $event の値を渡す。x-model と @change は同じ change の
                 購読者で、どちらが先に走るかに依存させたくないため。 -->
            <select x-model="form.category_id" required
                    @change="applyCategoryColor($event.target.value)"
                    class="w-full border rounded px-2 py-1 text-sm">
              <template x-for="category in categories" :key="category.id">
                <option :value="category.id" :selected="category.id === form.category_id" x-text="category.name"></option>
              </template>
            </select>
            <p class="text-[10px] text-gray-500 mt-1">
              カテゴリを選ぶと、識別カラーがそのカテゴリの既定色に切り替わります。
            </p>
            <p class="text-[10px] text-gray-500" x-show="categoryManagementHint" x-text="categoryManagementHint"></p>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-xs mb-1">幅 mm</label>
              <input type="number" min="1" max="20000" x-model.number="form.width_mm" required class="w-full border rounded px-2 py-1 text-sm">
            </div>
            <div>
              <label class="block text-xs mb-1">奥行 mm</label>
              <input type="number" min="1" max="20000" x-model.number="form.depth_mm" required class="w-full border rounded px-2 py-1 text-sm">
            </div>
            <div>
              <label class="block text-xs mb-1">高さ mm</label>
              <input type="number" min="1" x-model.number="form.height_mm" required class="w-full border rounded px-2 py-1 text-sm">
            </div>
          </div>
          <div>
            <label class="block text-xs mb-1">重量 kg</label>
            <input type="number" min="0" step="0.1" x-model.number="form.weight_kg" class="w-full border rounded px-2 py-1 text-sm">
          </div>
          </div>
          <!-- パレットは1マスを固定サイズにする。aspect-square だとダイアログ幅に比例して
               1マスが大きくなり、17行で1000px近くまで伸びてしまうため。 -->
          <div>
            <div class="flex items-center gap-2 mb-1">
              <label class="text-xs">識別カラー</label>
              <span class="w-6 h-4 rounded border" :style="`background:${form.color}`"></span>
              <code class="text-[10px] text-gray-500" x-text="form.color"></code>
            </div>
            <div class="grid w-max max-w-full gap-px border rounded p-1 bg-gray-100"
                 :style="`grid-template-columns: repeat(${paletteShades}, 18px)`">
              <template x-for="swatch in palette" :key="swatch.id">
                <button type="button" class="h-[18px] rounded-[2px] hover:outline hover:outline-1 hover:outline-gray-900"
                        :style="`background:${swatch.hex}`"
                        :class="form.color === swatch.hex ? 'outline outline-2 outline-gray-900 z-10' : ''"
                        :title="`${swatch.group} ${swatch.shade} / ${swatch.hex}`"
                        @click="form.color = swatch.hex"></button>
              </template>
            </div>
            <p class="mt-1 text-[10px] text-gray-400">赤はエラー表示に使うため選べません</p>
          </div>
          </div>
          <!-- shapeEditor は両画面で共有。フォームの shape を直接読み書きする。 -->
          <div x-data="shapeEditor(form)" @keydown.window="editorKey($event)">
            <div class="flex items-center gap-2 rounded border bg-gray-50 px-3 py-2">
              <div class="min-w-0">
                <p class="text-xs font-bold">平面形状</p>
                <p class="text-[10px] text-gray-500"
                   x-text="form.shape ? `パーツ形状（外形 ${form.width_mm} × ${form.depth_mm} mm）` : '通常の矩形'"></p>
              </div>
              <button type="button" class="ml-auto rounded border bg-white px-2 py-1 text-xs text-blue-600" @click="openEditor()">形を編集</button>
            </div>

            <div x-show="open" class="mt-2 rounded border p-3" @click.stop>
              <div class="mb-2 flex flex-wrap items-center gap-2">
                <button type="button" class="rounded border px-2 py-1 text-xs"
                        :class="tool === 'select' ? 'bg-blue-600 text-white' : 'bg-white'"
                        @click="chooseTool('select')">選択・移動</button>
                <button type="button" class="rounded border px-2 py-1 text-xs"
                        :class="tool === 'rect' ? 'bg-blue-600 text-white' : 'bg-white'"
                        @click="chooseTool('rect')">＋ 矩形</button>
                <button type="button" class="rounded border px-2 py-1 text-xs"
                        :class="tool === 'circle' ? 'bg-blue-600 text-white' : 'bg-white'"
                        @click="chooseTool('circle')">＋ 円</button>
                <button type="button" class="rounded border px-2 py-1 text-xs"
                        :class="tool === 'polygon' ? 'bg-blue-600 text-white' : 'bg-white'"
                        @click="chooseTool('polygon')">＋ 多角形</button>
                <button x-show="canChamfer" type="button"
                        class="rounded border border-violet-300 px-2 py-1 text-xs text-violet-700"
                        @click="applyChamfer()">角落とし</button>
                <button x-show="selectedPart && selectedPart.kind !== 'circle'" type="button"
                        class="rounded border border-teal-300 px-2 py-1 text-xs text-teal-700"
                        title="選択中のパーツをその場で90度回します"
                        @click="rotatePart()">90°回転</button>
                <span class="text-[10px] text-gray-500">
                  100mmグリッド（Shift中は10mm）。プレビューに入らない寸法は右の数値欄で調整できます。
                </span>
                <span class="ml-auto text-xs font-bold tabular-nums" x-text="`外形 幅 × 奥行: ${previewSize}`"></span>
              </div>
              <div class="grid gap-3 md:grid-cols-[minmax(0,1fr)_18rem]">
                <div>
                  <div class="relative rounded border bg-white p-5">
                    <span class="absolute left-1 top-1/2 -translate-y-1/2 -rotate-90 text-[10px] text-gray-500">幅 y（下が0）→</span>
                    <span class="absolute bottom-1 left-1/2 -translate-x-1/2 text-[10px] text-gray-500">奥行 x（左が0）→</span>
                    <svg x-ref="canvas" class="block aspect-[2/1] w-full touch-none bg-slate-50"
                         x-effect="$el.setAttribute('viewBox', viewBox)" preserveAspectRatio="xMidYMid meet"
                         @pointerdown="canvasPointerDown($event)" @pointermove="pointerMove($event)"
                         @pointerup="pointerUp($event)" @pointercancel="pointerUp($event)"
                         @dblclick.prevent="tool === 'polygon' && finishPolygon()">
                      <defs>
                        <!-- 見た目の刻みはズームに合わせて変える。100mm固定だと引いたとき線が潰れる。 -->
                        <pattern id="shape-grid" :width="gridStepMm" :height="gridStepMm" patternUnits="userSpaceOnUse">
                          <path :d="gridPath" fill="none" stroke="#cbd5e1" :stroke-width="decor.partStroke * 0.4"/>
                        </pattern>
                      </defs>
                      <rect width="100%" height="100%" fill="url(#shape-grid)"/>
                      <g x-html="partsMarkup"></g>
                      <g x-html="draftMarkup"></g>
                    </svg>
                    <!-- ズームは右下に重ねる。横軸ラベル（bottom-1 left-1/2）とは重ならない。 -->
                    <div class="absolute bottom-1 right-1 z-10 flex items-center gap-1 rounded border bg-white/90 px-1">
                      <button type="button" class="px-1 text-xs disabled:opacity-30" title="縮小"
                              :disabled="!canZoomOut" @click="zoomOut()">−</button>
                      <span class="text-[10px] tabular-nums text-gray-500" x-text="zoomLabel"></span>
                      <button type="button" class="px-1 text-xs disabled:opacity-30" title="拡大"
                              :disabled="!canZoomIn" @click="zoomIn()">＋</button>
                    </div>
                  </div>
                </div>
                <div class="max-h-72 overflow-y-auto">
                  <template x-for="(part, index) in parts" :key="index">
                    <div class="mb-2 rounded border p-2"
                         :class="selectedIndex === index ? 'bg-blue-50' : ''"
                         @click="selectedIndex = index; chamfers = [0,0,0,0]">
                      <div class="mb-1 flex items-center gap-2">
                        <span class="rounded bg-slate-200 px-1.5 py-0.5 text-[10px]" x-text="part.kind"></span>
                        <span class="text-[10px] text-gray-500" x-text="`パーツ ${index + 1}`"></span>
                        <button type="button" class="ml-auto text-sm text-red-600" title="削除"
                                @click.stop="removePart(index)">×</button>
                      </div>
                      <!-- 見出しと入力は同じ列定義（shape-editor.js）を回す。
                           画面のx（横）はデータのy、画面のy（縦）はデータのxに対応する。 -->
                      <div x-show="part.kind === 'rect'">
                        <div class="grid grid-cols-4 gap-1 text-center text-[10px] text-gray-500">
                          <template x-for="col in rectColumns" :key="col.label">
                            <span x-text="col.label"></span>
                          </template>
                        </div>
                        <div class="grid grid-cols-4 gap-1">
                          <template x-for="col in rectColumns" :key="col.label">
                            <input type="number" :value="part[col.field]"
                                   @change="updatePart(index, col.field, $event.target.value)"
                                   class="min-w-0 rounded border px-1 py-1 text-xs">
                          </template>
                        </div>
                      </div>
                      <div x-show="part.kind === 'circle'">
                        <div class="grid grid-cols-3 gap-1 text-center text-[10px] text-gray-500">
                          <template x-for="col in circleColumns" :key="col.label">
                            <span x-text="col.label"></span>
                          </template>
                        </div>
                        <div class="grid grid-cols-3 gap-1">
                          <template x-for="col in circleColumns" :key="col.label">
                            <input type="number" :value="part[col.field]"
                                   @change="updatePart(index, col.field, $event.target.value)"
                                   class="min-w-0 rounded border px-1 py-1 text-xs">
                          </template>
                        </div>
                      </div>
                      <div x-show="part.kind === 'polygon'" class="space-y-1">
                        <p class="text-[10px] text-gray-500"
                           x-text="`外形 ${partBounds(part).w} × ${partBounds(part).d} mm`"></p>
                        <div class="grid grid-cols-[1.5rem_1fr_1fr_1.25rem] gap-1 text-center text-[10px] text-gray-500">
                          <span></span>
                          <template x-for="col in pointColumns" :key="col.label">
                            <span x-text="col.label"></span>
                          </template>
                          <span></span>
                        </div>
                        <template x-for="(point, vertex) in part.points || []">
                          <div class="grid grid-cols-[1.5rem_1fr_1fr_1.25rem] items-center gap-1">
                            <span class="text-center text-[10px]" x-text="vertex + 1"></span>
                            <template x-for="col in pointColumns" :key="col.label">
                              <input type="number" :value="point[col.field]"
                                     @focus="focusVertex(index, vertex)" @blur="blurVertex()"
                                     @change="updatePoint(index, vertex, col.field, $event.target.value)"
                                     class="min-w-0 rounded border px-1 py-1 text-xs">
                            </template>
                            <!-- 3点未満の多角形は保存できないので、そこまで減ったら押せなくする。 -->
                            <button type="button" class="text-xs text-red-600 disabled:opacity-20"
                                    title="この頂点を削除"
                                    :disabled="(part.points || []).length <= 3"
                                    @click.stop="removeVertex(index, vertex)">×</button>
                          </div>
                        </template>
                        <p class="text-[10px] text-gray-400">
                          頂点を増やすには、プレビューの辺の中点にある＋を押します。
                        </p>
                      </div>
                    </div>
                  </template>
                  <div x-show="canChamfer" class="rounded border border-violet-200 bg-violet-50 p-2">
                    <p class="mb-1 text-[10px] text-violet-800">
                      量を入れてから「角落とし」を押す（左下 / 左上 / 右上 / 右下）
                    </p>
                    <div class="grid grid-cols-4 gap-1">
                      <template x-for="(_, corner) in chamfers">
                        <input type="number" min="0" x-model.number="chamfers[corner]"
                               class="min-w-0 rounded border px-1 py-1 text-xs">
                      </template>
                    </div>
                  </div>
                  <p x-show="parts.length === 0"
                     class="rounded bg-amber-50 p-2 text-xs text-amber-800">
                    矩形・円はドラッグ、多角形は頂点をクリックして追加してください。
                  </p>
                </div>
              </div>
              <p x-show="error" class="mt-2 rounded bg-red-50 p-2 text-xs text-red-700" x-text="error"></p>
              <div class="mt-3 flex flex-wrap gap-2">
                <button type="button" class="rounded bg-blue-600 px-3 py-1.5 text-xs text-white" @click="apply()">形を反映</button>
                <button type="button" class="rounded border px-3 py-1.5 text-xs" @click="closeEditor()">閉じる</button>
                <button type="button"
                        class="ml-auto rounded border border-red-300 px-3 py-1.5 text-xs text-red-600"
                        @click="resetToRectangle()">矩形に戻す</button>
              </div>
            </div>
          </div>
          <!-- Admin以外にはDOMごと出さない（x-showでは要素が残り、開発者ツールから触れてしまうため）。
               登録済みでも切り替えられる。Adminが自分の機材を後からテンプレートへ引き上げたい場面があるため。 -->
          <template x-if="showTemplateOwnershipControl">
            <div class="space-y-1">
              <label class="flex items-center gap-2 text-xs">
                <input type="checkbox" x-model="form.asTemplate">
                共通テンプレートとして登録する（全ユーザーが利用できます）
              </label>
              <p class="text-[10px] text-gray-500" x-show="form.id && form.asTemplate !== (form.user_id === null)"
                 x-text="form.asTemplate
                   ? '保存すると共通テンプレートへ移動し、全ユーザーが使えるようになります。'
                   : '保存すると共通テンプレートから外れ、自分のデータになります。'"></p>
            </div>
          </template>
          <div class="flex gap-2 pt-2">
            <button type="submit" class="flex-1 bg-blue-600 text-white rounded py-2 text-sm disabled:opacity-50"
                    :disabled="saving">保存</button>
            <button type="button" class="px-4 border rounded text-sm" @click="equipmentForm = null">キャンセル</button>
            <button type="button" x-show="form.id" class="px-4 border border-red-300 text-red-600 rounded text-sm"
                    @click="removeEquipment()">削除</button>
          </div>
        </div>
      </template>
    </form>
  </div>
