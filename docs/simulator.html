<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoadSym シミュレーター</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="min-h-screen bg-gray-100 text-gray-900">

<div id="nav-placeholder" hx-get="partials/nav.html" hx-trigger="load" hx-swap="innerHTML"></div>

<main x-data="simulator()" x-init="init()" x-cloak
      @keydown.window="onKeyDown($event)"
      class="flex flex-col lg:flex-row gap-3 p-3">

  <!-- ============ 左: シミュレーター表示部 ============ -->
  <section class="flex-1 min-w-0 print-full">
    <div class="flex items-center gap-2 mb-2 print-hidden">
      <h2 class="font-bold text-sm" x-text="layoutName || '無題のレイアウト'"></h2>
      <span class="text-xs text-gray-500" x-show="readOnly">（読み取り専用）</span>
      <div class="ml-auto flex items-center gap-1">
        <!-- クリアランスは吸着先とエラー判定の両方の基準。変えても配置は動かさず、
             確保できていない機材が赤くなる。 -->
        <label class="flex items-center gap-1 text-xs text-gray-600 mr-1"
               title="機材どうし・機材と壁の間に確保する隙間です。変更しても既に置いた機材は動かさず、確保できていないものを赤くして知らせます。">
          <span>クリアランス</span>
          <input type="number" inputmode="numeric"
                 class="w-14 border rounded px-1 py-1 text-xs text-right tabular-nums disabled:opacity-30"
                 :min="clearanceRange.min" :max="clearanceRange.max" step="1"
                 :disabled="readOnly"
                 :value="clearanceMm"
                 @change="setClearance($event.target.value); $event.target.value = clearanceMm">
          <span>mm</span>
        </label>
        <button type="button" class="px-2 py-1 text-xs border rounded bg-white disabled:opacity-30"
                :disabled="!canUndo || readOnly" @click="undo()">元に戻す</button>
        <button type="button" class="px-2 py-1 text-xs border rounded bg-white disabled:opacity-30"
                :disabled="!canRedo || readOnly" @click="redo()">やり直す</button>
        <button type="button" class="px-2 py-1 text-xs border rounded bg-white disabled:opacity-30"
                @click="exportPng()" :disabled="!hasContent">PNG</button>
        <button type="button" class="px-2 py-1 text-xs border rounded bg-white disabled:opacity-30"
                @click="window.print()" :disabled="!hasContent">印刷</button>
        <button type="button" class="px-2 py-1 text-xs border rounded bg-blue-600 text-white disabled:opacity-30"
                :disabled="readOnly || !hasContent" @click="openSaveDialog()">保存</button>
      </div>
    </div>

    <!-- エラーと状態の説明は消えては困るので通常のフローに置く。
         一時的な通知だけは荷台に重ねる（下のオーバーレイ）。 -->
    <p x-show="errorMessage" x-text="errorMessage"
       class="mb-2 text-sm text-red-600 bg-red-50 border border-red-200 rounded px-3 py-2 print-hidden"></p>
    <p x-show="stateMessage" x-text="stateMessage"
       class="mb-2 text-sm text-amber-700 bg-amber-50 border border-amber-200 rounded px-3 py-2 print-hidden"></p>

    <p x-show="truckSlots.length === 0 && !loading" class="text-sm text-gray-500 bg-white rounded border p-6 text-center mb-3">
      右の「トラック」タブから車両を選んで読み込んでください（最大3台）。<br>
      先に下の<span class="font-bold">機材置き場</span>へ必要な機材を並べておくこともできます。
    </p>

    <!-- 選択中の機材の寸法。操作の対象と手札を、目線を動かさずに確かめられるよう
         トラックのすぐ上に置く。
         未選択でも枠は残して案内文を出す。選択のたびに出入りさせると、その都度
         下のトラックが上下にずれて、掴もうとした機材がポインタの下から逃げる。 -->
    <div class="mb-2 bg-white rounded border p-2 text-[11px] print-hidden">
      <template x-if="selectedInfo">
        <div class="flex flex-wrap items-center gap-x-4 gap-y-1">
          <span class="font-bold" x-text="selectedInfo.name"></span>
          <span class="tabular-nums" x-text="`外形 ${selectedInfo.width}×${selectedInfo.depth} mm`"></span>
          <span class="tabular-nums" x-text="`左 ${selectedInfo.left} / 右 ${selectedInfo.right} mm`"></span>
          <span class="tabular-nums" x-text="`前 ${selectedInfo.front} / 後 ${selectedInfo.back} mm`"></span>
          <!-- 操作の説明は内容が変わらないので右端に固定する。左詰めのままだと、
               機材名や寸法の桁数で位置が動き、目が毎回それを追うことになる。 -->
          <span class="ml-auto text-gray-500">
            <span class="font-bold">R:</span>回転 /
            <span class="font-bold">Delete</span>:削除 /
            <span class="font-bold">Ctrl+D</span>:複製 / <span class="font-bold">矢印</span>:移動 /
            <span class="font-bold">Alt(Option)+ドラッグ</span>:スナップなし
          </span>
        </div>
      </template>
      <p x-show="!selectedInfo" class="text-gray-400">
        機材をクリックすると、寸法と周囲の隙間をここに表示します。
      </p>
    </div>

    <!-- トラックブロック。通知をこの下端に重ねるため relative にする。
         space-y-3 の中に絶対配置の子を混ぜると兄弟マージンの対象になるので、外側で囲む。 -->
    <div class="relative">
      <div class="space-y-3">
        <template x-for="slot in truckSlots" :key="slot.slot">
          <div class="bg-white rounded border p-2"
               :class="dropTarget === slot.slot ? 'ring-2 ring-blue-400'
                       : activeSlot === slot.slot ? 'ring-2 ring-blue-600' : ''"
               @pointerdown="activeSlot = slot.slot">
            <!-- 集計はSVGの上に一列で並べる。荷台が横長なので縦の場所を節約したい -->
            <div class="flex flex-wrap items-center gap-x-4 gap-y-1 mb-1 text-[11px]"
                 x-data="{ s: null }" x-effect="s = summaryOf(slot)">
              <span class="text-xs font-bold" x-text="slot.truck.name"></span>
              <template x-if="s">
                <div class="flex flex-wrap items-center gap-x-4 gap-y-1">
                  <span><span class="text-gray-500">配置率</span>
                    <span class="tabular-nums ml-1" x-text="(s.floorAreaRatio * 100).toFixed(1) + ' %'"></span></span>
                  <span><span class="text-gray-500">機材</span>
                    <span class="tabular-nums ml-1" x-text="s.placementCount + ' 点'"></span></span>
                  <span :class="s.overPayload ? 'text-red-600 font-bold' : ''">
                    <span class="text-gray-500">総重量</span>
                    <span class="tabular-nums ml-1"
                          x-text="s.totalWeightKg.toLocaleString() + (s.maxPayloadKg ? ' / ' + Number(s.maxPayloadKg).toLocaleString() : '') + ' kg'"></span></span>
                  <!-- 収まらない操作は成立しないので、通常の配置操作では赤くならない。
                       主に「クリアランス設定を広げて、確保できていない機材が出た」ときに点く。 -->
                  <span x-show="s.invalidCount" class="text-red-600 font-bold"
                        title="荷台からのはみ出しと、クリアランス不足（壁・障害物・他の機材との隙間が設定値に満たない）の合計です。"
                        x-text="`要確認 ${s.invalidCount} 点`"></span>
                  <span x-show="s.overHeightCount" class="text-amber-700"
                        x-text="`高さ超過 ${s.overHeightCount} 点`"></span>
                </div>
              </template>
              <button type="button"
                      class="ml-auto px-2 py-1 text-[10px] border rounded bg-white hover:bg-gray-50 disabled:opacity-30 print-hidden"
                      :disabled="readOnly || slot.placements.length === 0"
                      @click.stop="autoArrange(slot.slot)">自動配置</button>
              <button type="button" class="text-[10px] text-red-600 hover:underline print-hidden"
                      x-show="!readOnly" @click="removeSlot(slot.slot)">外す</button>
            </div>

            <svg class="simulator-stage block border border-gray-200"
                 :style="stageStyle(slot)" :data-slot="slot.slot"
                 @pointerdown="onStagePointerDown($event, slot)"></svg>
          </div>
        </template>
      </div>

      <!-- 操作の結果を知らせる一時的な通知。
           通常のフローに置くと、表示・非表示のたびに下の荷台がずれて読みにくい。
           荷台SVGは下端に420mm相当の余白（尺規とキャプションだけの帯）があるので、
           トラックの下端に重ねれば図をほとんど隠さない。数秒で自動的に消える。 -->
      <div x-show="noticeMessage" x-transition.opacity.duration.150ms
           class="pointer-events-none absolute inset-x-0 bottom-0 z-10 flex justify-center px-2 pb-1 print-hidden">
        <p x-text="noticeMessage"
           class="pointer-events-auto rounded border border-amber-300 bg-amber-50/95 px-3 py-2
                  text-sm text-amber-800 shadow-md"></p>
      </div>
    </div>

    <!-- 機材置き場（トラックの下・幅いっぱい） -->
    <template x-if="stagingSlot">
      <div class="bg-white rounded border p-2 mt-3"
           :class="dropTarget === stagingSlot.slot ? 'ring-2 ring-blue-400'
                   : activeSlot === stagingSlot.slot ? 'ring-2 ring-blue-600' : ''"
           @pointerdown="activeSlot = stagingSlot.slot">
        <div class="flex items-center gap-3 mb-1" x-data="{ s: null }" x-effect="s = summaryOf(stagingSlot)">
          <span class="text-xs font-bold">機材置き場</span>
          <template x-if="s">
            <span class="text-[11px]" :class="s.placementCount ? 'text-amber-700' : 'text-green-700'"
                  x-text="s.placementCount
                    ? `積み込み待ち ${s.placementCount} 点 / 合計 ${s.totalWeightKg.toLocaleString()} kg`
                    : '積み込み待ちなし'"></span>
          </template>
          <span class="ml-auto text-[10px] text-gray-500 print-hidden">
            必要な機材をここに並べてから、トラックへドラッグして積み込みます。
          </span>
        </div>

        <svg class="simulator-stage block border border-gray-200"
             :style="stageStyle(stagingSlot)" :data-slot="stagingSlot.slot"
             @pointerdown="onStagePointerDown($event, stagingSlot)"></svg>
      </div>
    </template>
  </section>

  <!-- ============ 右: データ・操作タブ ============ -->
  <aside class="w-full lg:w-96 shrink-0 print-hidden">
    <div class="bg-white rounded border">
      <div class="flex border-b text-sm">
        <button type="button" class="flex-1 py-2" :class="tab === 'equipments' ? 'border-b-2 border-blue-600 font-bold' : 'text-gray-500'"
                @click="tab = 'equipments'">機材シンボル</button>
        <button type="button" class="flex-1 py-2" :class="tab === 'trucks' ? 'border-b-2 border-blue-600 font-bold' : 'text-gray-500'"
                @click="tab = 'trucks'">トラック</button>
      </div>

      <!-- 機材タブ -->
      <div x-show="tab === 'equipments'" class="p-2">
        <div class="flex items-center gap-2 mb-2">
          <input type="search" x-model="equipmentQuery" placeholder="名称・カテゴリで絞り込み"
                 class="flex-1 border rounded px-2 py-1 text-xs">
          <button type="button" class="px-2 py-1 text-xs border rounded bg-blue-600 text-white disabled:opacity-30"
                  :disabled="!canCreate" @click="openEquipmentForm(null)">追加</button>
        </div>
        <select x-model="categoryFilter" class="w-full border rounded px-2 py-1 text-xs mb-2">
          <option value="">すべてのカテゴリ</option>
          <template x-for="category in categories" :key="category.id">
            <option :value="category.id" x-text="category.name"></option>
          </template>
        </select>
        <p class="text-[11px] text-gray-500 mb-2">
          機材をクリックすると、選択中の荷台の空きスペースに配置されます。
        </p>

        <template x-for="section in equipmentSections" :key="section.key">
          <div class="mb-3" x-show="section.items.length">
            <h3 class="text-[11px] font-bold text-gray-500 mb-1" x-text="`${section.label}（${section.items.length}）`"></h3>
            <ul class="space-y-1">
              <template x-for="item in section.items" :key="item.id">
                <li class="flex items-center gap-2 border rounded px-2 py-1">
                  <span class="w-3 h-3 rounded-sm shrink-0" :style="`background:${item.color}`"></span>
                  <button type="button" class="flex-1 min-w-0 text-left disabled:opacity-40"
                          :disabled="readOnly" @click="addEquipment(item)">
                    <span class="block text-xs truncate" x-text="item.name"></span>
                    <span class="block text-[10px] text-gray-400 truncate" x-text="item.categoryName"></span>
                  </button>
                  <span class="text-[10px] text-gray-500 tabular-nums shrink-0"
                        x-text="`${item.width_mm}×${item.depth_mm}×${item.height_mm} / ${item.weight_kg}kg`"></span>
                  <button type="button" class="text-[10px] text-blue-600 hover:underline shrink-0"
                          x-show="canEditItem(item)" @click="openEquipmentForm(item)">編集</button>
                </li>
              </template>
            </ul>
          </div>
        </template>
      </div>

      <!-- トラックタブ -->
      <div x-show="tab === 'trucks'" class="p-2">
        <div class="flex items-center gap-2 mb-2">
          <input type="search" x-model="truckQuery" placeholder="名称で絞り込み"
                 class="flex-1 border rounded px-2 py-1 text-xs">
          <button type="button" class="px-2 py-1 text-xs border rounded bg-blue-600 text-white disabled:opacity-30"
                  :disabled="!canCreate" @click="openTruckForm(null)">追加</button>
        </div>
        <p class="text-[11px] text-gray-500 mb-2">
          トラックをクリックすると荷台に読み込みます（最大3台まで同時表示）。
        </p>

        <template x-for="section in truckSections" :key="section.key">
          <div class="mb-3" x-show="section.items.length">
            <h3 class="text-[11px] font-bold text-gray-500 mb-1" x-text="`${section.label}（${section.items.length}）`"></h3>
            <ul class="space-y-1">
              <template x-for="item in section.items" :key="item.id">
                <li class="flex items-center gap-2 border rounded px-2 py-1">
                  <button type="button" class="flex-1 text-left text-xs truncate disabled:opacity-40"
                          :disabled="slots.length >= 3 || readOnly"
                          @click="loadTruck(item)" x-text="item.name"></button>
                  <span class="text-[10px] text-gray-500 tabular-nums shrink-0"
                        x-text="`${item.bed_width_mm}×${item.bed_depth_mm}×${item.bed_height_mm}`"></span>
                  <button type="button" class="text-[10px] text-blue-600 hover:underline shrink-0"
                          x-show="canEditItem(item)" @click="openTruckForm(item)">編集</button>
                </li>
              </template>
            </ul>
          </div>
        </template>
      </div>
    </div>
  </aside>

  <!-- ============ 機材フォーム ============ -->
  <div x-show="equipmentForm" class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50"
       @click.self="equipmentForm = null">
    <form x-show="equipmentForm" class="bg-white rounded-lg shadow-lg w-full max-w-4xl p-5 space-y-3 max-h-[95vh] overflow-y-auto"
          @submit.prevent="saveEquipment()">
      <template x-if="equipmentForm">
        <!-- x-if で null を除外した時点のフォームを別名にし、内側の形状エディタを含む全項目で同じオブジェクトを参照する。 -->
        <div x-data="{ form: equipmentForm }" class="space-y-3">
          <h3 class="font-bold" x-text="form.id ? '機材を編集' : '機材を追加'"></h3>
          <!-- 入力欄とパレットを左右に並べ、縦を詰める。13インチのノートでもスクロールせずに
               全体を見せるため。形状エディタだけはこの外に置き、キャンバスの幅を削らない。 -->
          <div class="grid gap-3 md:grid-cols-[minmax(0,1fr)_auto] md:items-start">
          <div class="space-y-3 min-w-0">
          <div>
            <label class="block text-xs mb-1">名称</label>
            <input x-model="form.name" required class="w-full border rounded px-2 py-1 text-sm">
          </div>
          <div>
            <label class="block text-xs mb-1">カテゴリ</label>
            <!-- x-model は option が x-for で描かれる前に初期化されるため、値だけでは選択が復元されない。
                 :selected を option 側に持たせて、描画時に保存済みのカテゴリを選ばせる。
                 識別カラーの差し替えには $event の値を渡す。x-model と @change は同じ change の
                 購読者で、どちらが先に走るかに依存させたくないため。 -->
            <select x-model="form.category_id" required
                    @change="applyCategoryColor($event.target.value)"
                    class="w-full border rounded px-2 py-1 text-sm">
              <template x-for="category in categories" :key="category.id">
                <option :value="category.id" :selected="category.id === form.category_id" x-text="category.name"></option>
              </template>
            </select>
            <p class="text-[10px] text-gray-500 mt-1">
              カテゴリを選ぶと、識別カラーがそのカテゴリの既定色に切り替わります。
            </p>
            <p class="text-[10px] text-gray-500" x-show="isAdmin">
              カテゴリの追加・並び替え・既定色の変更は管理画面で行えます。
            </p>
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-xs mb-1">幅 mm</label>
              <input type="number" min="1" max="20000" x-model.number="form.width_mm" required class="w-full border rounded px-2 py-1 text-sm">
            </div>
            <div>
              <label class="block text-xs mb-1">奥行 mm</label>
              <input type="number" min="1" max="20000" x-model.number="form.depth_mm" required class="w-full border rounded px-2 py-1 text-sm">
            </div>
            <div>
              <label class="block text-xs mb-1">高さ mm</label>
              <input type="number" min="1" x-model.number="form.height_mm" required class="w-full border rounded px-2 py-1 text-sm">
            </div>
          </div>
          <div>
            <label class="block text-xs mb-1">重量 kg</label>
            <input type="number" min="0" step="0.1" x-model.number="form.weight_kg" class="w-full border rounded px-2 py-1 text-sm">
          </div>
          </div>
          <!-- パレットは1マスを固定サイズにする。aspect-square だとダイアログ幅に比例して
               1マスが大きくなり、17行で1000px近くまで伸びてしまうため。 -->
          <div>
            <div class="flex items-center gap-2 mb-1">
              <label class="text-xs">識別カラー</label>
              <span class="w-6 h-4 rounded border" :style="`background:${form.color}`"></span>
              <code class="text-[10px] text-gray-500" x-text="form.color"></code>
            </div>
            <div class="grid w-max max-w-full gap-px border rounded p-1 bg-gray-100"
                 :style="`grid-template-columns: repeat(${paletteShades}, 18px)`">
              <template x-for="swatch in palette" :key="swatch.id">
                <button type="button" class="h-[18px] rounded-[2px] hover:outline hover:outline-1 hover:outline-gray-900"
                        :style="`background:${swatch.hex}`"
                        :class="form.color === swatch.hex ? 'outline outline-2 outline-gray-900 z-10' : ''"
                        :title="`${swatch.group} ${swatch.shade} / ${swatch.hex}`"
                        @click="form.color = swatch.hex"></button>
              </template>
            </div>
            <p class="mt-1 text-[10px] text-gray-400">赤はエラー表示に使うため選べません</p>
          </div>
          </div>
          <!-- shapeEditor は管理画面と共有。フォームの shape を直接読み書きする。 -->
          <div x-data="shapeEditor(form)" @keydown.window="editorKey($event)">
            <div class="flex items-center gap-2 rounded border bg-gray-50 px-3 py-2">
              <div class="min-w-0">
                <p class="text-xs font-bold">平面形状</p>
                <p class="text-[10px] text-gray-500"
                   x-text="form.shape ? `パーツ形状（外形 ${form.width_mm} × ${form.depth_mm} mm）` : '通常の矩形'"></p>
              </div>
              <button type="button" class="ml-auto rounded border bg-white px-2 py-1 text-xs text-blue-600" @click="openEditor()">形を編集</button>
            </div>

            <div x-show="open" class="mt-2 rounded border p-3" @click.stop>
              <div class="mb-2 flex flex-wrap items-center gap-2">
                <button type="button" class="rounded border px-2 py-1 text-xs"
                        :class="tool === 'select' ? 'bg-blue-600 text-white' : 'bg-white'"
                        @click="chooseTool('select')">選択・移動</button>
                <button type="button" class="rounded border px-2 py-1 text-xs"
                        :class="tool === 'rect' ? 'bg-blue-600 text-white' : 'bg-white'"
                        @click="chooseTool('rect')">＋ 矩形</button>
                <button type="button" class="rounded border px-2 py-1 text-xs"
                        :class="tool === 'circle' ? 'bg-blue-600 text-white' : 'bg-white'"
                        @click="chooseTool('circle')">＋ 円</button>
                <button type="button" class="rounded border px-2 py-1 text-xs"
                        :class="tool === 'polygon' ? 'bg-blue-600 text-white' : 'bg-white'"
                        @click="chooseTool('polygon')">＋ 多角形</button>
                <button x-show="canChamfer" type="button"
                        class="rounded border border-violet-300 px-2 py-1 text-xs text-violet-700"
                        @click="applyChamfer()">角落とし</button>
                <button x-show="selectedPart && selectedPart.kind !== 'circle'" type="button"
                        class="rounded border border-teal-300 px-2 py-1 text-xs text-teal-700"
                        title="選択中のパーツをその場で90度回します"
                        @click="rotatePart()">90°回転</button>
                <span class="text-[10px] text-gray-500">
                  100mmグリッド（Shift中は10mm）。プレビューに入らない寸法は右の数値欄で調整できます。
                </span>
                <span class="ml-auto text-xs font-bold tabular-nums" x-text="`外形 幅 × 奥行: ${previewSize}`"></span>
              </div>
              <div class="grid gap-3 md:grid-cols-[minmax(0,1fr)_18rem]">
                <div>
                  <div class="relative rounded border bg-white p-5">
                    <span class="absolute left-1 top-1/2 -translate-y-1/2 -rotate-90 text-[10px] text-gray-500">幅 y（下が0）→</span>
                    <span class="absolute bottom-1 left-1/2 -translate-x-1/2 text-[10px] text-gray-500">奥行 x（左が0）→</span>
                    <svg x-ref="canvas" class="block aspect-[2/1] w-full touch-none bg-slate-50"
                         x-effect="$el.setAttribute('viewBox', viewBox)" preserveAspectRatio="xMidYMid meet"
                         @pointerdown="canvasPointerDown($event)" @pointermove="pointerMove($event)"
                         @pointerup="pointerUp($event)" @pointercancel="pointerUp($event)"
                         @dblclick.prevent="tool === 'polygon' && finishPolygon()">
                      <defs>
                        <!-- 見た目の刻みはズームに合わせて変える。100mm固定だと引いたとき線が潰れる。 -->
                        <pattern id="shape-grid-simulator" :width="gridStepMm" :height="gridStepMm" patternUnits="userSpaceOnUse">
                          <path :d="gridPath" fill="none" stroke="#cbd5e1" :stroke-width="decor.partStroke * 0.4"/>
                        </pattern>
                      </defs>
                      <rect width="100%" height="100%" fill="url(#shape-grid-simulator)"/>
                      <g x-html="partsMarkup"></g>
                      <g x-html="draftMarkup"></g>
                    </svg>
                    <!-- ズームは右下に重ねる。横軸ラベル（bottom-1 left-1/2）とは重ならない。 -->
                    <div class="absolute bottom-1 right-1 z-10 flex items-center gap-1 rounded border bg-white/90 px-1">
                      <button type="button" class="px-1 text-xs disabled:opacity-30" title="縮小"
                              :disabled="!canZoomOut" @click="zoomOut()">−</button>
                      <span class="text-[10px] tabular-nums text-gray-500" x-text="zoomLabel"></span>
                      <button type="button" class="px-1 text-xs disabled:opacity-30" title="拡大"
                              :disabled="!canZoomIn" @click="zoomIn()">＋</button>
                    </div>
                  </div>
                </div>
                <div class="max-h-72 overflow-y-auto">
                  <template x-for="(part, index) in parts" :key="index">
                    <div class="mb-2 rounded border p-2"
                         :class="selectedIndex === index ? 'bg-blue-50' : ''"
                         @click="selectedIndex = index; chamfers = [0,0,0,0]">
                      <div class="mb-1 flex items-center gap-2">
                        <span class="rounded bg-slate-200 px-1.5 py-0.5 text-[10px]" x-text="part.kind"></span>
                        <span class="text-[10px] text-gray-500" x-text="`パーツ ${index + 1}`"></span>
                        <button type="button" class="ml-auto text-sm text-red-600" title="削除"
                                @click.stop="removePart(index)">×</button>
                      </div>
                      <!-- 見出しと入力は同じ列定義（shape-editor.js）を回す。
                           画面のx（横）はデータのy、画面のy（縦）はデータのxに対応する。 -->
                      <div x-show="part.kind === 'rect'">
                        <div class="grid grid-cols-4 gap-1 text-center text-[10px] text-gray-500">
                          <template x-for="col in rectColumns" :key="col.label">
                            <span x-text="col.label"></span>
                          </template>
                        </div>
                        <div class="grid grid-cols-4 gap-1">
                          <template x-for="col in rectColumns" :key="col.label">
                            <input type="number" :value="part[col.field]"
                                   @change="updatePart(index, col.field, $event.target.value)"
                                   class="min-w-0 rounded border px-1 py-1 text-xs">
                          </template>
                        </div>
                      </div>
                      <div x-show="part.kind === 'circle'">
                        <div class="grid grid-cols-3 gap-1 text-center text-[10px] text-gray-500">
                          <template x-for="col in circleColumns" :key="col.label">
                            <span x-text="col.label"></span>
                          </template>
                        </div>
                        <div class="grid grid-cols-3 gap-1">
                          <template x-for="col in circleColumns" :key="col.label">
                            <input type="number" :value="part[col.field]"
                                   @change="updatePart(index, col.field, $event.target.value)"
                                   class="min-w-0 rounded border px-1 py-1 text-xs">
                          </template>
                        </div>
                      </div>
                      <div x-show="part.kind === 'polygon'" class="space-y-1">
                        <p class="text-[10px] text-gray-500"
                           x-text="`外形 ${partBounds(part).w} × ${partBounds(part).d} mm`"></p>
                        <div class="grid grid-cols-[1.5rem_1fr_1fr_1.25rem] gap-1 text-center text-[10px] text-gray-500">
                          <span></span>
                          <template x-for="col in pointColumns" :key="col.label">
                            <span x-text="col.label"></span>
                          </template>
                          <span></span>
                        </div>
                        <template x-for="(point, vertex) in part.points || []">
                          <div class="grid grid-cols-[1.5rem_1fr_1fr_1.25rem] items-center gap-1">
                            <span class="text-center text-[10px]" x-text="vertex + 1"></span>
                            <template x-for="col in pointColumns" :key="col.label">
                              <input type="number" :value="point[col.field]"
                                     @focus="focusVertex(index, vertex)" @blur="blurVertex()"
                                     @change="updatePoint(index, vertex, col.field, $event.target.value)"
                                     class="min-w-0 rounded border px-1 py-1 text-xs">
                            </template>
                            <!-- 3点未満の多角形は保存できないので、そこまで減ったら押せなくする。 -->
                            <button type="button" class="text-xs text-red-600 disabled:opacity-20"
                                    title="この頂点を削除"
                                    :disabled="(part.points || []).length <= 3"
                                    @click.stop="removeVertex(index, vertex)">×</button>
                          </div>
                        </template>
                        <p class="text-[10px] text-gray-400">
                          頂点を増やすには、プレビューの辺の中点にある＋を押します。
                        </p>
                      </div>
                    </div>
                  </template>
                  <div x-show="canChamfer" class="rounded border border-violet-200 bg-violet-50 p-2">
                    <p class="mb-1 text-[10px] text-violet-800">
                      量を入れてから「角落とし」を押す（左下 / 左上 / 右上 / 右下）
                    </p>
                    <div class="grid grid-cols-4 gap-1">
                      <template x-for="(_, corner) in chamfers">
                        <input type="number" min="0" x-model.number="chamfers[corner]"
                               class="min-w-0 rounded border px-1 py-1 text-xs">
                      </template>
                    </div>
                  </div>
                  <p x-show="parts.length === 0"
                     class="rounded bg-amber-50 p-2 text-xs text-amber-800">
                    矩形・円はドラッグ、多角形は頂点をクリックして追加してください。
                  </p>
                </div>
              </div>
              <p x-show="error" class="mt-2 rounded bg-red-50 p-2 text-xs text-red-700" x-text="error"></p>
              <div class="mt-3 flex flex-wrap gap-2">
                <button type="button" class="rounded bg-blue-600 px-3 py-1.5 text-xs text-white" @click="apply()">形を反映</button>
                <button type="button" class="rounded border px-3 py-1.5 text-xs" @click="closeEditor()">閉じる</button>
                <button type="button"
                        class="ml-auto rounded border border-red-300 px-3 py-1.5 text-xs text-red-600"
                        @click="resetToRectangle()">矩形に戻す</button>
              </div>
            </div>
          </div>
          <!-- Admin以外にはDOMごと出さない（x-showでは要素が残り、開発者ツールから触れてしまうため）。
               登録済みでも切り替えられる。Adminが自分の機材を後からテンプレートへ引き上げたい場面があるため。 -->
          <template x-if="isAdmin">
            <div class="space-y-1">
              <label class="flex items-center gap-2 text-xs">
                <input type="checkbox" x-model="form.asTemplate">
                共通テンプレートとして登録する（全ユーザーが利用できます）
              </label>
              <p class="text-[10px] text-gray-500" x-show="form.id && form.asTemplate !== (form.user_id === null)"
                 x-text="form.asTemplate
                   ? '保存すると共通テンプレートへ移動し、全ユーザーが使えるようになります。'
                   : '保存すると共通テンプレートから外れ、自分のデータになります。'"></p>
            </div>
          </template>
          <div class="flex gap-2 pt-2">
            <button type="submit" class="flex-1 bg-blue-600 text-white rounded py-2 text-sm disabled:opacity-50"
                    :disabled="saving">保存</button>
            <button type="button" class="px-4 border rounded text-sm" @click="equipmentForm = null">キャンセル</button>
            <button type="button" x-show="form.id" class="px-4 border border-red-300 text-red-600 rounded text-sm"
                    @click="removeEquipment()">削除</button>
          </div>
        </div>
      </template>
    </form>
  </div>

  <!-- ============ トラックフォーム ============ -->
  <div x-show="truckForm" class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50"
       @click.self="truckForm = null">
    <form x-show="truckForm" class="bg-white rounded-lg shadow-lg w-full max-w-lg p-5 space-y-3 max-h-[90vh] overflow-y-auto"
          @submit.prevent="saveTruck()">
      <template x-if="truckForm">
        <div class="space-y-3">
          <h3 class="font-bold" x-text="truckForm.id ? 'トラックを編集' : 'トラックを追加'"></h3>
          <div>
            <label class="block text-xs mb-1">名称</label>
            <input x-model="truckForm.name" required class="w-full border rounded px-2 py-1 text-sm">
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-xs mb-1">荷台幅 mm</label>
              <input type="number" min="1" x-model.number="truckForm.bed_width_mm" required class="w-full border rounded px-2 py-1 text-sm">
            </div>
            <div>
              <label class="block text-xs mb-1">荷台奥行 mm</label>
              <input type="number" min="1" x-model.number="truckForm.bed_depth_mm" required class="w-full border rounded px-2 py-1 text-sm">
            </div>
            <div>
              <label class="block text-xs mb-1">荷台高さ mm</label>
              <input type="number" min="1" x-model.number="truckForm.bed_height_mm" required class="w-full border rounded px-2 py-1 text-sm">
            </div>
          </div>
          <div>
            <label class="block text-xs mb-1">最大積載重量 kg（空欄なら制限なし）</label>
            <input type="number" min="1" x-model="truckForm.max_payload_kg" class="w-full border rounded px-2 py-1 text-sm">
          </div>

          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="text-xs font-bold">荷台内の障害物（タイヤハウス・柱など）</span>
              <button type="button" class="ml-auto text-xs text-blue-600 hover:underline" @click="addObstacleRow()">＋追加</button>
            </div>
            <p class="text-[10px] text-gray-500 mb-1">
              荷台の左前＝図の左下を原点(0,0)に、x は奥行方向（右へ）、y は幅方向（上へ）の位置を mm で入力します。
            </p>
            <!-- 形状エディタと同じく、画面の横軸をx・縦軸をyと呼ぶ。保存列は x_mm=幅方向 / y_mm=奥行方向 の
                 ままなので、x欄は y_mm に、y欄は x_mm に結び付ける。幅・奥行は寸法名なのでそのまま。 -->
            <div x-show="truckForm.obstacles.length"
                 class="grid grid-cols-6 gap-1 text-center text-[10px] text-gray-500">
              <span class="col-span-2"></span>
              <span>x</span>
              <span>y</span>
              <span>幅</span>
              <span>奥行</span>
            </div>
            <template x-for="(obstacle, index) in truckForm.obstacles" :key="index">
              <div class="grid grid-cols-6 gap-1 mb-1 items-center">
                <input x-model="obstacle.label" placeholder="名称" class="col-span-2 border rounded px-1 py-0.5 text-xs">
                <input type="number" x-model.number="obstacle.y_mm" placeholder="x" class="border rounded px-1 py-0.5 text-xs">
                <input type="number" x-model.number="obstacle.x_mm" placeholder="y" class="border rounded px-1 py-0.5 text-xs">
                <input type="number" x-model.number="obstacle.width_mm" placeholder="幅" class="border rounded px-1 py-0.5 text-xs">
                <div class="flex gap-1">
                  <input type="number" x-model.number="obstacle.depth_mm" placeholder="奥行" class="w-full border rounded px-1 py-0.5 text-xs">
                  <button type="button" class="text-red-600 text-xs" @click="truckForm.obstacles.splice(index, 1)">×</button>
                </div>
              </div>
            </template>
          </div>

          <!-- 機材と同じく、Admin以外にはDOMごと出さない。登録済みでも行き来できる。 -->
          <template x-if="isAdmin">
            <div class="space-y-1">
              <label class="flex items-center gap-2 text-xs">
                <input type="checkbox" x-model="truckForm.asTemplate">
                共通テンプレートとして登録する
              </label>
              <p class="text-[10px] text-gray-500"
                 x-show="truckForm.id && truckForm.asTemplate !== (truckForm.user_id === null)"
                 x-text="truckForm.asTemplate
                   ? '保存すると共通テンプレートへ移動し、全ユーザーが使えるようになります。'
                   : '保存すると共通テンプレートから外れ、自分のデータになります。'"></p>
            </div>
          </template>
          <div class="flex gap-2 pt-2">
            <button type="submit" class="flex-1 bg-blue-600 text-white rounded py-2 text-sm disabled:opacity-50"
                    :disabled="saving">保存</button>
            <button type="button" class="px-4 border rounded text-sm" @click="truckForm = null">キャンセル</button>
            <button type="button" x-show="truckForm.id" class="px-4 border border-red-300 text-red-600 rounded text-sm"
                    @click="removeTruck()">削除</button>
          </div>
        </div>
      </template>
    </form>
  </div>

  <!-- ============ 保存ダイアログ ============ -->
  <div x-show="saveDialog" class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50"
       @click.self="saveDialog = null">
    <form x-show="saveDialog" class="bg-white rounded-lg shadow-lg w-full max-w-sm p-5 space-y-3"
          @submit.prevent="saveLayoutNow()">
      <template x-if="saveDialog">
        <div class="space-y-3">
          <h3 class="font-bold">レイアウトを保存</h3>
          <div>
            <label class="block text-xs mb-1">名前</label>
            <input x-model="saveDialog.name" required placeholder="例: 3/15 ○○ホール 仕込み"
                   class="w-full border rounded px-2 py-1 text-sm">
          </div>
          <div>
            <label class="block text-xs mb-1">備考</label>
            <textarea x-model="saveDialog.note" rows="2" class="w-full border rounded px-2 py-1 text-sm"></textarea>
          </div>
          <label class="flex items-center gap-2 text-xs" x-show="layoutId">
            <input type="checkbox" x-model="saveDialog.asNew">
            別のレイアウトとして保存する
          </label>
          <div class="flex gap-2 pt-2">
            <button type="submit" class="flex-1 bg-blue-600 text-white rounded py-2 text-sm disabled:opacity-50"
                    :disabled="saving">保存</button>
            <button type="button" class="px-4 border rounded text-sm" @click="saveDialog = null">キャンセル</button>
          </div>
        </div>
      </template>
    </form>
  </div>
</main>

<script type="module">
  import { simulator } from './assets/js/pages/simulator.js';
  window.simulator = simulator;
</script>
<script defer src="https://unpkg.com/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
<script defer src="https://unpkg.com/alpinejs@3.15.12/dist/cdn.min.js" integrity="sha384-pb6hrQvo4s23cEUFtj0CZkzGE3jyK3pj26RIupXXxhSrrcUA/Cn0lZgcCrGH0t6L" crossorigin="anonymous"></script>
</body>
</html>
