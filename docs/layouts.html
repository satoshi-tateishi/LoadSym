<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoadSym レイアウト一覧</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="min-h-screen bg-gray-100 text-gray-900">

<div id="nav-placeholder" hx-get="partials/nav.html" hx-trigger="load" hx-swap="innerHTML"></div>

<main x-data="layoutList()" x-init="init()" x-cloak class="max-w-5xl mx-auto p-4">

  <div class="flex items-center gap-3 mb-3">
    <h1 class="font-bold">レイアウト</h1>
    <input type="search" x-model="query" placeholder="名前・備考・トラックで絞り込み"
           class="border rounded px-2 py-1 text-xs w-64">
    <a href="./simulator.html" class="ml-auto px-3 py-1.5 text-xs rounded bg-blue-600 text-white">新規作成</a>
  </div>

  <p x-show="errorMessage" x-text="errorMessage"
     class="mb-3 text-sm text-red-600 bg-red-50 border border-red-200 rounded px-3 py-2"></p>
  <p x-show="noticeMessage" x-text="noticeMessage"
     class="mb-3 text-sm text-green-700 bg-green-50 border border-green-200 rounded px-3 py-2"></p>
  <p x-show="loading" class="text-sm text-gray-500">読み込み中...</p>

  <!-- 自分のレイアウト -->
  <section class="mb-6" x-show="!loading">
    <div class="flex items-baseline gap-2 mb-2">
      <h2 class="text-sm font-bold">自分のレイアウト</h2>
      <!-- 保存できる件数の上限（DBトリガで担保）。絞り込み後の件数ではなく
           常に全件を出す。上限に対する残りを見る数字なので、検索で減っては困る。 -->
      <span class="ml-auto text-xs tabular-nums"
            :class="mine.length >= layoutLimit ? 'text-red-600 font-bold'
                    : mine.length >= layoutLimit * 0.9 ? 'text-amber-700' : 'text-gray-500'"
            :title="`保存できるレイアウトは1ユーザーあたり${layoutLimit}件までです`"
            x-text="`${mine.length} / ${layoutLimit}`"></span>
    </div>
    <p x-show="myLayouts.length === 0" class="text-sm text-gray-500 bg-white border rounded p-6 text-center">
      保存したレイアウトはまだありません。<a href="./simulator.html" class="text-blue-600 hover:underline">シミュレーター</a>で作成して保存してください。
    </p>
    <!-- 2つの表は上下に並ぶので、列の構成と幅を揃える（table-fixed ＋ 同じ幅指定）。
         中身に合わせて自動で幅が決まると、同じ意味の列が表ごとに違う位置に来て、
         見比べるたびに視線が横へ泳ぐ。名前だけは残り幅いっぱいを使わせる。 -->
    <table x-show="myLayouts.length" class="w-full table-fixed bg-white border rounded text-xs">
      <thead class="bg-gray-50 text-gray-500">
        <tr>
          <th class="text-left px-3 py-2">名前</th>
          <!-- 自分の表では常に自分の名前になるが、列を揃えるために出す。 -->
          <th class="text-left px-3 py-2 w-32">作成者</th>
          <th class="text-left px-3 py-2 w-56">トラック</th>
          <th class="text-left px-3 py-2 w-36">更新日時</th>
          <th class="px-3 py-2 w-32"></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="layout in myLayouts" :key="layout.id">
          <tr class="border-t">
            <td class="px-3 py-2">
              <button type="button" class="text-blue-600 hover:underline font-medium" @click="open(layout)"
                      x-text="layout.name"></button>
              <span class="block text-[10px] text-gray-400" x-text="layout.note"></span>
            </td>
            <td class="px-3 py-2 text-gray-600" x-text="ownerName(layout)"></td>
            <td class="px-3 py-2 text-gray-600 truncate" :title="layout.truckNames" x-text="layout.truckNames"></td>
            <td class="px-3 py-2 text-gray-500 tabular-nums" x-text="formatDate(layout.updated_at)"></td>
            <td class="px-3 py-2 text-right whitespace-nowrap">
              <button type="button" class="text-blue-600 hover:underline disabled:opacity-30"
                      :disabled="!canEditLayouts || saving" @click="openRenameForm(layout)">名前変更</button>
              <button type="button" class="ml-2 text-red-600 hover:underline disabled:opacity-30"
                      :disabled="!canEditLayouts || saving" @click="remove(layout)">削除</button>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </section>

  <!-- 他のユーザーのレイアウト -->
  <section x-show="!loading && otherLayouts.length">
    <h2 class="text-sm font-bold mb-2">他のユーザーのレイアウト<span class="font-normal text-gray-500">（閲覧のみ）</span></h2>
    <!-- 幅の指定は「自分のレイアウト」の表と必ず同じにすること（上のコメント参照）。 -->
    <table class="w-full table-fixed bg-white border rounded text-xs">
      <thead class="bg-gray-50 text-gray-500">
        <tr>
          <th class="text-left px-3 py-2">名前</th>
          <th class="text-left px-3 py-2 w-32">作成者</th>
          <th class="text-left px-3 py-2 w-56">トラック</th>
          <th class="text-left px-3 py-2 w-36">更新日時</th>
          <th class="px-3 py-2 w-32"></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="layout in otherLayouts" :key="layout.id">
          <tr class="border-t">
            <td class="px-3 py-2">
              <button type="button" class="text-blue-600 hover:underline font-medium" @click="open(layout)"
                      x-text="layout.name"></button>
              <span class="block text-[10px] text-gray-400" x-text="layout.note"></span>
            </td>
            <td class="px-3 py-2 text-gray-600" x-text="ownerName(layout)"></td>
            <td class="px-3 py-2 text-gray-600 truncate" :title="layout.truckNames" x-text="layout.truckNames"></td>
            <td class="px-3 py-2 text-gray-500 tabular-nums" x-text="formatDate(layout.updated_at)"></td>
            <td class="px-3 py-2 text-right whitespace-nowrap">
              <button type="button" class="text-blue-600 hover:underline disabled:opacity-30"
                      :disabled="!canEditLayouts || saving" @click="duplicate(layout)">複製して編集</button>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </section>

  <!-- 名前変更 -->
  <div x-show="renameForm" class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50"
       @click.self="renameForm = null">
    <form x-show="renameForm" class="bg-white rounded-lg shadow-lg w-full max-w-sm p-5 space-y-3"
          @submit.prevent="saveRename()">
      <template x-if="renameForm">
        <div class="space-y-3">
          <h3 class="font-bold">レイアウトの名前を変更</h3>
          <div>
            <label class="block text-xs mb-1">名前</label>
            <input x-model="renameForm.name" required class="w-full border rounded px-2 py-1 text-sm">
          </div>
          <div>
            <label class="block text-xs mb-1">備考</label>
            <textarea x-model="renameForm.note" rows="2" class="w-full border rounded px-2 py-1 text-sm"></textarea>
          </div>
          <div class="flex gap-2 pt-2">
            <button type="submit" class="flex-1 bg-blue-600 text-white rounded py-2 text-sm disabled:opacity-50"
                    :disabled="saving">保存</button>
            <button type="button" class="px-4 border rounded text-sm" @click="renameForm = null">キャンセル</button>
          </div>
        </div>
      </template>
    </form>
  </div>
</main>

<script type="module">
  import { layoutList } from './assets/js/pages/layouts.js';
  window.layoutList = layoutList;
</script>
<script defer src="https://unpkg.com/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
<script defer src="https://unpkg.com/alpinejs@3.15.12/dist/cdn.min.js" integrity="sha384-pb6hrQvo4s23cEUFtj0CZkzGE3jyK3pj26RIupXXxhSrrcUA/Cn0lZgcCrGH0t6L" crossorigin="anonymous"></script>
</body>
</html>
